<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Web-based SDR streaming" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Radio" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/radio.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/radio-180.png" />
    <title>Eliware Radio</title>
    <style>
      body {
        background: #080808;
        color: #00ff66;
        font: 16px monospace;
        margin: 1rem;
      }
      main {
        max-width: 40rem;
        margin: auto;
      }
      section {
        border: 1px solid #00ff66;
        margin-block: 1rem;
        padding: 1rem;
      }
      audio {
        display: block;
        width: 100%;
      }
      .channel-status {
        min-height: 1.25em;
      }
      a {
        color: #00ff66;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Radio</h1>
      <p>Server status: <span id="server-status">Checking</span></p>
      <section aria-labelledby="police-heading">
        <h2 id="police-heading">Police</h2>
        <p id="police-status" class="channel-status" aria-live="polite">Checking receiver…</p>
        <audio id="police-audio" controls preload="none" src="/streams/police.mp3">
          Audio playback is unavailable.
        </audio>
      </section>
      <section aria-labelledby="fire-heading">
        <h2 id="fire-heading">Fire</h2>
        <p id="fire-status" class="channel-status" aria-live="polite">Checking receiver…</p>
        <audio id="fire-audio" controls preload="none" src="/streams/fire.mp3">
          Audio playback is unavailable.
        </audio>
      </section>
      <p><a href="/health">Health</a> · <a href="/ready">Readiness</a></p>
    </main>
    <script src="/client.js"></script>
    <script>
      radioLoadReadiness(fetch, document);
      radioBindAudioStatus(document);
      radioLoadChannelStatus(fetch, document);
      setInterval(() => radioLoadChannelStatus(fetch, document), 3000);
    </script>
  </body>
</html>
