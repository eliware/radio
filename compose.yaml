services:
  radio:
    build: .
    environment:
      PORT: ${PORT:-3000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${PORT:-3000}/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
