services:
  radio:
    build:
      context: .
      dockerfile: docker/radio/Dockerfile
    environment:
      RADIO_HEALTH_PORT: 1400
      RADIO_CONFIG_DIR: /run/radio
      LOG_LEVEL: info
    volumes:
      - ./.env.pd:/run/radio/police.env:ro
      - ./.env.fd:/run/radio/fire.env:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "127.0.0.1:1400:1400"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:1400/ready').then((r) => process.exit(r.ok ? 0 :
          1)).catch(() => process.exit(1))
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
